name: Nova-Ygdrassil CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Connector V3 Dependencies
      run: |
        cd connector-v3
        npm ci

    - name: Run Connector V3 Unit Tests
      run: |
        cd connector-v3
        npm test

    - name: Verify MCP Server Syntax
      run: |
        node --check grok-connector-3000/mcp/server.mjs
        node --check chatgpt-claude-connector-3000/mcp/server.mjs
